<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>해시 생성기/검증기 - UtilTools</title>
  <meta name="description" content="MD5, SHA1, SHA256 등 다양한 해시 알고리즘으로 텍스트를 암호화하고 검증하는 도구입니다." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="text-center mb-5">
          <h1 class="display-5 fw-bold text-purple mb-3">
            <i class="fas fa-fingerprint"></i> 해시 생성기/검증기
          </h1>
          <p class="lead text-muted">MD5, SHA1, SHA256 등 다양한 해시 알고리즘으로 텍스트를 암호화하고 검증합니다</p>
        </div>

        <div class="row g-4">
          <!-- 입력 -->
          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-keyboard"></i> 입력 텍스트</h5>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <label for="inputText" class="form-label">해시할 텍스트</label>
                  <textarea class="form-control" id="inputText" rows="6" placeholder="해시로 변환할 텍스트를 입력하세요..."></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">해시 알고리즘</label>
                  <div class="row g-2">
                    <div class="col-6">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="md5" checked>
                        <label class="form-check-label" for="md5">MD5</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="sha1" checked>
                        <label class="form-check-label" for="sha1">SHA1</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="sha256" checked>
                        <label class="form-check-label" for="sha256">SHA256</label>
                      </div>
                    </div>
                    <div class="col-6">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="sha512">
                        <label class="form-check-label" for="sha512">SHA512</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ripemd160">
                        <label class="form-check-label" for="ripemd160">RIPEMD160</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="whirlpool">
                        <label class="form-check-label" for="whirlpool">Whirlpool</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <button class="btn btn-primary" onclick="hashGenerator.generateHashes()">
                    <i class="fas fa-magic"></i> 해시 생성
                  </button>
                  <button class="btn btn-outline-secondary ms-2" onclick="hashGenerator.clearAll()">
                    <i class="fas fa-trash"></i> 모두 지우기
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- 결과 -->
          <div class="col-md-6">
            <div class="card h-100">
              <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-list"></i> 해시 결과</h5>
              </div>
              <div class="card-body">
                <div id="hashResults">
                  <div class="text-center text-muted">
                    <i class="fas fa-info-circle fa-2x mb-3"></i>
                    <p>텍스트를 입력하고 해시 생성 버튼을 클릭하세요.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 파일 해시 -->
        <div class="row mt-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-file"></i> 파일 해시</h5>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="fileInput" class="form-label">파일 선택</label>
                      <input type="file" class="form-control" id="fileInput" accept="*/*">
                    </div>
                    <button class="btn btn-outline-primary" onclick="hashGenerator.generateFileHash()">
                      <i class="fas fa-file-upload"></i> 파일 해시 생성
                    </button>
                  </div>
                  <div class="col-md-6">
                    <div id="fileHashResults"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 해시 검증 -->
        <div class="row mt-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-check-circle"></i> 해시 검증</h5>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="verifyText" class="form-label">원본 텍스트</label>
                      <textarea class="form-control" id="verifyText" rows="3" placeholder="검증할 원본 텍스트"></textarea>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="verifyHash" class="form-label">해시값</label>
                      <input type="text" class="form-control" id="verifyHash" placeholder="검증할 해시값">
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="verifyAlgorithm" class="form-label">알고리즘</label>
                  <select class="form-select" id="verifyAlgorithm">
                    <option value="MD5">MD5</option>
                    <option value="SHA1">SHA1</option>
                    <option value="SHA256">SHA256</option>
                    <option value="SHA512">SHA512</option>
                  </select>
                </div>
                <button class="btn btn-success" onclick="hashGenerator.verifyHash()">
                  <i class="fas fa-search"></i> 해시 검증
                </button>
                <div id="verifyResult" class="mt-3"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/languages.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/hash-generator.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      languageManager = new LanguageManager();
    });
  </script>
</body>
</html>

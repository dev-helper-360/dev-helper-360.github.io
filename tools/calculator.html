<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>계산기 - UtilTools</title>
  <meta name="description" content="무료 온라인 계산기. 실용적인 계산기 인터페이스로 빠르고 정확한 계산을 제공합니다." />
  <meta name="keywords" content="계산기, 온라인계산기, 수식계산, 온라인도구" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
  <style>
    .calculator {
      max-width: 400px;
      margin: 0 auto;
      background: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    
    .calculator-display {
      background: #fff;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: right;
      font-family: 'Courier New', monospace;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .calculator-expression {
      font-size: 1.2rem;
      color: #6c757d;
      min-height: 30px;
      word-wrap: break-word;
    }
    
    .calculator-result {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      min-height: 40px;
    }
    
    .calculator-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    
    .calc-btn {
      padding: 15px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .calc-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    
    .calc-btn:active {
      transform: translateY(0);
    }
    
    .calc-btn.operator {
      background: #6f42c1;
      color: white;
    }
    
    .calc-btn.operator:hover {
      background: #5a34a1;
    }
    
    .calc-btn.equals {
      background: #28a745;
      color: white;
      grid-column: span 2;
    }
    
    .calc-btn.equals:hover {
      background: #218838;
    }
    
    .calc-btn.clear {
      background: #dc3545;
      color: white;
    }
    
    .calc-btn.clear:hover {
      background: #c82333;
    }
    
    .calc-btn.function {
      background: #ffc107;
      color: #333;
    }
    
    .calc-btn.function:hover {
      background: #e0a800;
    }
    
    .calc-btn.zero {
      grid-column: span 2;
    }
    
    @media (max-width: 480px) {
      .calculator {
        padding: 15px;
      }
      
      .calc-btn {
        padding: 12px;
        font-size: 1rem;
      }
      
      .calculator-result {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow">
          <div class="card-header bg-purple text-white">
            <h1 class="h3 mb-0">
              <i class="fas fa-calculator me-2"></i>계산기
            </h1>
          </div>
          <div class="card-body">
            <p class="text-muted mb-4 text-center">
              실용적인 계산기 인터페이스로 빠르고 정확한 계산을 제공합니다.
            </p>
            
            <!-- 계산기 UI -->
            <div class="calculator">
              <div class="calculator-display">
                <div class="calculator-expression" id="expression">0</div>
                <div class="calculator-result" id="result">0</div>
              </div>
              
              <div class="calculator-buttons">
                <!-- 첫 번째 행 -->
                <button class="calc-btn clear" onclick="clearAll()">C</button>
                <button class="calc-btn function" onclick="clearEntry()">CE</button>
                <button class="calc-btn function" onclick="backspace()">⌫</button>
                <button class="calc-btn operator" onclick="setOperator('/')">÷</button>
                
                <!-- 두 번째 행 -->
                <button class="calc-btn" onclick="appendNumber('7')">7</button>
                <button class="calc-btn" onclick="appendNumber('8')">8</button>
                <button class="calc-btn" onclick="appendNumber('9')">9</button>
                <button class="calc-btn operator" onclick="setOperator('*')">×</button>
                
                <!-- 세 번째 행 -->
                <button class="calc-btn" onclick="appendNumber('4')">4</button>
                <button class="calc-btn" onclick="appendNumber('5')">5</button>
                <button class="calc-btn" onclick="appendNumber('6')">6</button>
                <button class="calc-btn operator" onclick="setOperator('-')">−</button>
                
                <!-- 네 번째 행 -->
                <button class="calc-btn" onclick="appendNumber('1')">1</button>
                <button class="calc-btn" onclick="appendNumber('2')">2</button>
                <button class="calc-btn" onclick="appendNumber('3')">3</button>
                <button class="calc-btn operator" onclick="setOperator('+')">+</button>
                
                <!-- 다섯 번째 행 -->
                <button class="calc-btn zero" onclick="appendNumber('0')">0</button>
                <button class="calc-btn" onclick="appendDecimal()">.</button>
                <button class="calc-btn equals" onclick="calculate()">=</button>
              </div>
            </div>
            
            <!-- 추가 기능 버튼들 -->
            <div class="row mt-4">
              <div class="col-12">
                <h6 class="fw-bold mb-3">🔧 추가 기능</h6>
                <div class="d-flex flex-wrap gap-2">
                  <button class="btn btn-outline-primary btn-sm" onclick="addFunction('Math.sqrt')">√</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addFunction('Math.pow')">x²</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addFunction('Math.abs')">|x|</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addFunction('Math.round')">round</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addFunction('Math.floor')">floor</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addFunction('Math.ceil')">ceil</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addParentheses('(')">(</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addParentheses(')')">)</button>
                  <button class="btn btn-outline-primary btn-sm" onclick="addOperator('%')">%</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="card mt-4">
          <div class="card-header">
            <h5 class="mb-0">💡 사용법</h5>
          </div>
          <div class="card-body">
            <ul class="mb-0">
              <li><strong>기본 계산:</strong> 숫자 버튼과 연산자 버튼을 클릭하여 계산합니다.</li>
              <li><strong>C 버튼:</strong> 모든 입력을 지웁니다.</li>
              <li><strong>CE 버튼:</strong> 현재 입력만 지웁니다.</li>
              <li><strong>⌫ 버튼:</strong> 마지막 입력을 삭제합니다.</li>
              <li><strong>추가 기능:</strong> 수학 함수와 괄호를 사용할 수 있습니다.</li>
              <li><strong>키보드 지원:</strong> 숫자 키와 연산자 키를 사용할 수 있습니다.</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/languages.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/calculator.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      languageManager = new LanguageManager();
    });
  </script>
</body>
</html>

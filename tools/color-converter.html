<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>색상 변환기 - UtilTools</title>
  <meta name="description" content="HEX, RGB, HSL 색상 코드를 서로 변환하는 도구입니다." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="text-center mb-5">
          <h1 class="display-5 fw-bold text-purple mb-3">
            <i class="fas fa-palette"></i> 색상 변환기
          </h1>
          <p class="lead text-muted">HEX, RGB, HSL 색상 코드를 서로 변환합니다</p>
        </div>

        <div class="row g-4">
          <!-- HEX 입력 -->
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="fas fa-hashtag"></i> HEX</h5>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <label for="hexInput" class="form-label">HEX 색상 코드</label>
                  <div class="input-group">
                    <span class="input-group-text">#</span>
                    <input type="text" class="form-control" id="hexInput" placeholder="FF0000" maxlength="6">
                  </div>
                </div>
                <div class="color-preview" id="hexPreview"></div>
              </div>
            </div>
          </div>

          <!-- RGB 입력 -->
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="fas fa-rss"></i> RGB</h5>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label">RGB 값</label>
                  <div class="row g-2">
                    <div class="col-4">
                      <input type="number" class="form-control" id="rgbR" placeholder="R" min="0" max="255">
                    </div>
                    <div class="col-4">
                      <input type="number" class="form-control" id="rgbG" placeholder="G" min="0" max="255">
                    </div>
                    <div class="col-4">
                      <input type="number" class="form-control" id="rgbB" placeholder="B" min="0" max="255">
                    </div>
                  </div>
                </div>
                <div class="color-preview" id="rgbPreview"></div>
              </div>
            </div>
          </div>

          <!-- HSL 입력 -->
          <div class="col-md-4">
            <div class="card h-100">
              <div class="card-header bg-warning text-dark">
                <h5 class="mb-0"><i class="fas fa-circle"></i> HSL</h5>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label">HSL 값</label>
                  <div class="row g-2">
                    <div class="col-4">
                      <input type="number" class="form-control" id="hslH" placeholder="H" min="0" max="360">
                    </div>
                    <div class="col-4">
                      <input type="number" class="form-control" id="hslS" placeholder="S%" min="0" max="100">
                    </div>
                    <div class="col-4">
                      <input type="number" class="form-control" id="hslL" placeholder="L%" min="0" max="100">
                    </div>
                  </div>
                </div>
                <div class="color-preview" id="hslPreview"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 색상 팔레트 -->
        <div class="row mt-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-palette"></i> 색상 팔레트</h5>
              </div>
              <div class="card-body">
                <div class="row g-2" id="colorPalette">
                  <!-- 팔레트가 여기에 생성됩니다 -->
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 색상 정보 -->
        <div class="row mt-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-info-circle"></i> 색상 정보</h5>
              </div>
              <div class="card-body">
                <div class="row">
                  <div class="col-md-6">
                    <h6>현재 색상</h6>
                    <div class="current-color-display" id="currentColorDisplay"></div>
                  </div>
                  <div class="col-md-6">
                    <h6>색상 코드</h6>
                    <div class="color-codes" id="colorCodes"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/languages.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/color-converter.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      languageManager = new LanguageManager();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코드 포매터 - UtilTools</title>
  <meta name="description" content="HTML, CSS, JavaScript, Python, Java 코드를 자동으로 포맷팅하는 무료 온라인 도구입니다.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    .code-editor {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
      background-color: #f8f9fa;
      min-height: 300px;
      resize: vertical;
    }
    .formatted-code {
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
      min-height: 300px;
      overflow-x: auto;
    }
    .language-selector {
      margin-bottom: 15px;
    }
    .format-options {
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <header class="text-center py-4">
          <h1 class="display-5 fw-bold text-purple">
            <i class="fas fa-code me-2"></i>코드 포매터
          </h1>
          <p class="lead text-muted">HTML, CSS, JavaScript, Python, Java 코드를 자동으로 포맷팅합니다</p>
        </header>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-10">
        <!-- 언어 선택 -->
        <div class="language-selector">
          <label for="languageSelect" class="form-label fw-bold">프로그래밍 언어 선택:</label>
          <select id="languageSelect" class="form-select">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="json">JSON</option>
            <option value="xml">XML</option>
            <option value="sql">SQL</option>
            <option value="php">PHP</option>
            <option value="csharp">C#</option>
            <option value="cpp">C++</option>
            <option value="c">C</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>
            <option value="ruby">Ruby</option>
            <option value="swift">Swift</option>
            <option value="kotlin">Kotlin</option>
            <option value="scala">Scala</option>
            <option value="typescript">TypeScript</option>
            <option value="jsx">JSX</option>
            <option value="tsx">TSX</option>
          </select>
        </div>

        <!-- 포맷팅 옵션 -->
        <div class="format-options">
          <h5 class="mb-3">포맷팅 옵션</h5>
          <div class="row">
            <div class="col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="indentSpaces" checked>
                <label class="form-check-label" for="indentSpaces">
                  스페이스로 들여쓰기
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="removeComments">
                <label class="form-check-label" for="removeComments">
                  주석 제거
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="minify">
                <label class="form-check-label" for="minify">
                  코드 압축 (minify)
                </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="indentSize" class="form-label">들여쓰기 크기:</label>
                <select id="indentSize" class="form-select">
                  <option value="2">2 스페이스</option>
                  <option value="4" selected>4 스페이스</option>
                  <option value="8">8 스페이스</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="lineEnding" class="form-label">줄 끝 문자:</label>
                <select id="lineEnding" class="form-select">
                  <option value="lf">LF (Unix)</option>
                  <option value="crlf" selected>CRLF (Windows)</option>
                  <option value="cr">CR (Mac)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <!-- 입력 영역 -->
          <div class="col-md-6">
            <div class="card">
              <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">원본 코드</h5>
                <div>
                  <button class="btn btn-sm btn-outline-secondary" onclick="loadExample()">
                    <i class="fas fa-file-code me-1"></i>예제 로드
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" onclick="clearCode()">
                    <i class="fas fa-trash me-1"></i>지우기
                  </button>
                </div>
              </div>
              <div class="card-body">
                <textarea id="sourceCode" class="form-control code-editor" placeholder="포맷팅할 코드를 여기에 입력하세요..."></textarea>
              </div>
            </div>
          </div>

          <!-- 출력 영역 -->
          <div class="col-md-6">
            <div class="card">
              <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">포맷팅된 코드</h5>
                <div>
                  <button class="btn btn-sm btn-outline-primary" onclick="copyFormattedCode()">
                    <i class="fas fa-copy me-1"></i>복사
                  </button>
                  <button class="btn btn-sm btn-outline-success" onclick="downloadCode()">
                    <i class="fas fa-download me-1"></i>다운로드
                  </button>
                </div>
              </div>
              <div class="card-body">
                <pre id="formattedCode" class="formatted-code"><code class="language-plaintext">포맷팅된 코드가 여기에 표시됩니다.</code></pre>
              </div>
            </div>
          </div>
        </div>

        <!-- 포맷팅 버튼 -->
        <div class="row mt-3">
          <div class="col-12 text-center">
            <button class="btn btn-purple btn-lg" onclick="formatCode()">
              <i class="fas fa-magic me-2"></i>코드 포맷팅
            </button>
          </div>
        </div>

        <!-- 통계 정보 -->
        <div class="row mt-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h5 class="mb-0">코드 통계</h5>
              </div>
              <div class="card-body">
                <div class="row text-center">
                  <div class="col-md-3">
                    <div class="border-end">
                      <h4 id="lineCount" class="text-primary">0</h4>
                      <small class="text-muted">총 줄 수</small>
                    </div>
                  </div>
                  <div class="col-md-3">
                    <div class="border-end">
                      <h4 id="charCount" class="text-success">0</h4>
                      <small class="text-muted">총 문자 수</small>
                    </div>
                  </div>
                  <div class="col-md-3">
                    <div class="border-end">
                      <h4 id="wordCount" class="text-info">0</h4>
                      <small class="text-muted">총 단어 수</small>
                    </div>
                  </div>
                  <div class="col-md-3">
                    <h4 id="sizeReduction" class="text-warning">0%</h4>
                    <small class="text-muted">크기 감소</small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ruby.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-swift.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-kotlin.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-scala.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-tsx.min.js"></script>
  <script src="../js/code-formatter.js"></script>
</body>
</html>
